# Announces a CurseForge file the moment it has passed review.
#
# CurseForge sends no notification when a file is approved, so this polls: every 15 minutes it
# lists the project's files through CFWidget (api.cfwidget.com), a keyless public mirror of the
# CurseForge API that only carries approved, publicly visible files. Any file newer than the last
# one announced is posted to Discord with that version's section of CHANGELOG.md and its download
# link. The high-water mark is committed back to the repo in .github/curseforge-announced.json so
# the poller never announces a file twice.
#
# Repository settings this needs:
#   secret   DISCORD_WEBHOOK         the channel webhook URL
#   variable CURSEFORGE_PROJECT_ID   the numeric project id (shown on the project page, "About Project")
name: CurseForge approval announce

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curseforge-announce
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Find newly approved files
        id: poll
        env:
          PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: |
          STATE=.github/curseforge-announced.json
          if [ ! -f "$STATE" ]; then
            # First run: everything already on CurseForge is old news. Seed the mark at the newest
            # file and announce nothing; only files approved from now on are posted.
            echo "seed=true" >> "$GITHUB_OUTPUT"
            LAST=-1
          else
            echo "seed=false" >> "$GITHUB_OUTPUT"
            LAST=$(jq -r '.lastFileId // 0' "$STATE")
          fi
          # CFWidget refreshes its copy of a project every few minutes; a miss here is retried on
          # the next schedule rather than failing the run.
          curl -sS -f -H "Accept: application/json" "https://api.cfwidget.com/${PROJECT}" > project.json \
            || { echo "CFWidget unavailable this run"; echo '{"files":[]}' > project.json; }
          # Oldest first, so several approvals post in order.
          jq --argjson last "$LAST" '[.files[] | select(.id > $last)] | sort_by(.id)' project.json > new.json
          COUNT=$(jq 'length' new.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "${COUNT} newly approved file(s) since id ${LAST}"

      - name: Announce on Discord
        if: ${{ steps.poll.outputs.count != '0' && steps.poll.outputs.seed == 'false' && secrets.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          jq -c '.[]' new.json | while read -r file; do
            ID=$(jq -r '.id' <<<"$file")
            NAME=$(jq -r '.display' <<<"$file")
            FILENAME=$(jq -r '.name' <<<"$file")
            TYPE=$(jq -r '.type' <<<"$file")          # release, beta, alpha
            PAGE=$(jq -r '.url' <<<"$file")
            VERSIONS=$(jq -r '[.versions[]] | join(" · ")' <<<"$file")
            case "$TYPE" in
              release) KIND="New release"; COLOR=5763719 ;;
              beta)    KIND="New beta"; COLOR=15844367 ;;
              *)       KIND="New alpha"; COLOR=15548997 ;;
            esac
            # The mod version is what sits between the Minecraft version and "-all.jar" in the
            # file name; its CHANGELOG.md section is the announcement body.
            VERSION=$(sed -E 's/^ndidisplays-[0-9.]+-(.+)-all\.jar$/\1/; s/^ndidisplays-[0-9.]+-(.+)\.jar$/\1/' <<<"$FILENAME")
            awk -v tag="${VERSION}" '
              /^## \[/ { if (found) exit; if (index($0, "## [" tag "]") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | cat -s > notes.txt
            if [ ! -s notes.txt ]; then
              echo "See the file page for details." > notes.txt
            fi
            NOTES=$(head -c 3800 notes.txt)
            if [ "$(wc -c < notes.txt)" -gt 3800 ]; then
              NOTES="${NOTES}"$'\n'"…full notes on the file page."
            fi
            jq -n \
              --arg title "${KIND}: ${NAME} is live on CurseForge" \
              --arg url "$PAGE" \
              --arg notes "$NOTES" \
              --arg links "[Download ${FILENAME}](${PAGE})" \
              --arg versions "$VERSIONS" \
              --argjson color "$COLOR" \
              '{
                embeds: [{
                  title: $title,
                  url: $url,
                  color: $color,
                  description: $notes,
                  fields: [{ name: $versions, value: $links }],
                  footer: { text: "Approved on CurseForge. Needs the NDI runtime on each client for live video." }
                }]
              }' > payload.json
            curl -sS -f -H "Content-Type: application/json" -d @payload.json "${DISCORD_WEBHOOK}"
            echo "announced ${NAME} (${ID})"
          done

      - name: Record the high-water mark
        if: ${{ steps.poll.outputs.count != '0' }}
        shell: bash
        run: |
          STATE=.github/curseforge-announced.json
          jq '{lastFileId: (map(.id) | max), lastFileName: (sort_by(.id) | last | .display)}' new.json > "$STATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          git commit -m "CurseForge announce: $(jq -r '.lastFileName' "$STATE") posted"
          git push
